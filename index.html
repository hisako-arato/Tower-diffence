<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#120e24">
<title>結界の守り手</title>
<meta name="description" content="剣と魔法の世界で英雄を召喚し、王都の大結界を守るタワーディフェンス">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="結界の守り手">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- タイトル -->
  <div id="title-screen">
    <div class="ts-glow"></div>
    <div class="ts-logo"><small>— Guardians of the Barrier —</small>結界の守り手</div>
    <div class="ts-tap">TAP TO START</div>
  </div>

  <!-- ホーム -->
  <section id="screen-home" class="screen">
    <div class="home-bg">
      <div class="sky-stars"></div>
      <svg class="castle" viewBox="0 0 400 160" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
        <path d="M0 160 V110 H30 V80 H45 V95 H60 V70 H70 V50 l8 -14 l8 14 V70 H96 V100 H130 V60 H140 V40 l10 -18 l10 18 V60 H170 V90 H190 V30 l10 -22 l10 22 V90 H230 V60 H240 V40 l10 -18 l10 18 V60 H270 V100 H304 V70 H314 V50 l8 -14 l8 14 V70 H340 V95 H355 V80 H370 V110 H400 V160 Z" fill="#1a1433"/>
        <g fill="#ffd77a" opacity=".8"><rect x="196" y="50" width="8" height="12" rx="4"/><rect x="146" y="72" width="7" height="10" rx="3"/><rect x="246" y="72" width="7" height="10" rx="3"/><rect x="76" y="80" width="6" height="9" rx="3"/><rect x="318" y="80" width="6" height="9" rx="3"/></g>
      </svg>
      <div class="barrier"></div>
    </div>

    <header class="topbar">
      <div class="tb-left"><div class="player-name" id="home-name">召喚士</div><div id="home-progress" class="progress"></div></div>
      <div class="currencies">
        <div class="currency"><i class="gem"></i><span class="stones-val">0</span></div>
        <div class="currency"><i class="crystal"></i><span class="crystals-val">0</span></div>
      </div>
    </header>

    <button id="btn-install" class="install-chip" hidden>アプリ版をインストール</button>

    <div class="home-side">
      <button data-go="screen-mission" class="side-btn"><span class="sb-ico">✓</span>ミッション<em id="mission-badge" hidden>0</em></button>
      <button id="btn-loginbonus" class="side-btn"><span class="sb-ico">▦</span>ログボ</button>
    </div>

    <div class="navi-area">
      <div id="navi-bubble" class="bubble">おかえりなさい、召喚士さま！</div>
      <button id="navi" aria-label="精霊ルミナ">
        <svg viewBox="0 0 200 250" aria-hidden="true">
          <defs>
            <radialGradient id="aura" cx="50%" cy="45%" r="50%"><stop offset="0" stop-color="#bff3ff" stop-opacity=".9"/><stop offset=".6" stop-color="#6fc8ff" stop-opacity=".25"/><stop offset="1" stop-color="#6fc8ff" stop-opacity="0"/></radialGradient>
            <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8f7ff"/><stop offset="1" stop-color="#8fd0ff"/></linearGradient>
            <linearGradient id="dress" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#9fdcff"/></linearGradient>
          </defs>
          <circle cx="100" cy="120" r="100" fill="url(#aura)"/>
          <g class="wings" fill="#dff6ff" opacity=".75">
            <ellipse cx="55" cy="125" rx="40" ry="20" transform="rotate(-30 55 125)"/>
            <ellipse cx="145" cy="125" rx="40" ry="20" transform="rotate(30 145 125)"/>
            <ellipse cx="65" cy="155" rx="26" ry="12" transform="rotate(20 65 155)"/>
            <ellipse cx="135" cy="155" rx="26" ry="12" transform="rotate(-20 135 155)"/>
          </g>
          <path d="M100 128 L70 215 Q100 228 130 215 Z" fill="url(#dress)"/>
          <path d="M88 128 Q100 138 112 128 L108 145 H92 Z" fill="#c9ecff"/>
          <circle cx="100" cy="98" r="32" fill="#ffe9de"/>
          <path d="M66 100 Q62 58 100 56 Q138 58 134 100 Q130 78 118 74 Q104 86 80 80 Q70 86 66 100 Z" fill="url(#hair)"/>
          <path d="M66 98 Q60 140 72 150 Q70 120 72 104 Z M134 98 Q140 140 128 150 Q130 120 128 104 Z" fill="url(#hair)"/>
          <g class="eyes"><ellipse cx="88" cy="102" rx="5" ry="7" fill="#2a6fb0"/><ellipse cx="112" cy="102" rx="5" ry="7" fill="#2a6fb0"/>
            <circle cx="89.5" cy="99" r="2" fill="#fff"/><circle cx="113.5" cy="99" r="2" fill="#fff"/></g>
          <ellipse cx="80" cy="112" rx="5" ry="3" fill="#ffb3b3" opacity=".6"/><ellipse cx="120" cy="112" rx="5" ry="3" fill="#ffb3b3" opacity=".6"/>
          <path d="M95 116 Q100 120 105 116" stroke="#b05a5a" stroke-width="2" fill="none" stroke-linecap="round"/>
          <path d="M92 58 l8 -14 l8 14 l-8 -4 z" fill="#ffe27a"/>
        </svg>
      </button>
      <div class="navi-name">結界の精霊 ルミナ</div>
    </div>

    <button id="home-event" class="home-event" hidden></button>
    <nav class="home-menu">
      <button class="menu-main" data-go="screen-stages"><span>出撃</span><small>QUEST</small></button>
      <button class="menu-sub" data-go="screen-party"><span>編成・育成</span><small>PARTY</small></button>
      <button class="menu-sub summon" data-go="screen-summon"><span>召喚</span><small>SUMMON</small><em>PICK UP</em></button>
      <button class="menu-sub" data-go="screen-story"><span>ストーリー</span><small>STORY</small></button>
      <button class="menu-sub" id="btn-settings"><span>設定</span><small>OPTION</small></button>
    </nav>
  </section>

  <!-- ステージ選択 -->
  <section id="screen-stages" class="screen">
    <header class="topbar sub">
      <button class="back" data-go="screen-home">‹ ホーム</button>
      <div class="sub-title">クエスト</div>
      <div class="currency"><i class="gem"></i><span class="stones-val">0</span></div>
    </header>
    <div id="stage-list" class="scroll"></div>
  </section>

  <!-- 編成 -->
  <section id="screen-party" class="screen">
    <header class="topbar sub">
      <button class="back" data-go="screen-home">‹ ホーム</button>
      <div class="sub-title">編成・育成</div>
      <button class="back" data-go="screen-stages">出撃 ›</button>
    </header>
    <div class="sub-currency"><div class="currency"><i class="crystal"></i><span class="crystals-val">0</span></div></div>
    <div class="scroll">
      <div class="sec-label">出撃メンバー（最大6人）</div>
      <div id="party-slots"></div>
      <div id="char-detail"></div>
      <div class="sec-label">所持キャラ</div>
      <div id="roster"></div>
    </div>
  </section>

  <!-- ストーリー一覧 -->
  <section id="screen-story" class="screen">
    <header class="topbar sub">
      <button class="back" data-go="screen-home">‹ ホーム</button>
      <div class="sub-title">ストーリー</div>
      <span class="spacer"></span>
    </header>
    <div id="story-list" class="scroll"></div>
  </section>

  <!-- ミッション -->
  <section id="screen-mission" class="screen">
    <header class="topbar sub">
      <button class="back" data-go="screen-home">‹ ホーム</button>
      <div class="sub-title">ミッション</div>
      <span class="spacer"></span>
    </header>
    <div id="mission-tabs" class="tabs">
      <button data-mt="daily" class="on">デイリー<em></em></button>
      <button data-mt="normal">通常<em></em></button>
    </div>
    <div id="mission-list" class="scroll"></div>
    <div class="mission-foot"><button id="btn-claim-all" class="btn primary">一括受け取り</button></div>
  </section>

  <!-- イベント -->
  <section id="screen-event" class="screen">
    <header class="topbar sub">
      <button class="back" data-go="screen-home">‹ ホーム</button>
      <div class="sub-title">イベント</div>
      <div class="currency"><i class="gem"></i><span class="stones-val">0</span></div>
    </header>
    <div class="scroll">
      <div id="event-head"></div>
      <div class="sec-label">イベントクエスト</div>
      <div id="event-stages"></div>
      <div class="sec-label">交換所</div>
      <div id="event-shop"></div>
    </div>
  </section>

  <!-- 召喚 -->
  <section id="screen-summon" class="screen">
    <header class="topbar sub">
      <button class="back" data-go="screen-home">‹ ホーム</button>
      <div class="sub-title">召喚</div>
      <div class="currency"><i class="gem"></i><span class="stones-val">0</span></div>
    </header>
    <div id="banner-tabs"></div>
    <div id="banner"></div>
    <div id="summon-info"></div>
    <div class="summon-btns">
      <button id="btn-pull1" class="btn ghost"></button>
      <button id="btn-pull10" class="btn primary"></button>
    </div>
    <button id="btn-rates" class="link-btn">提供割合・召喚の説明</button>
    <div id="summon-fx" class="summon-fx"></div>
  </section>

  <!-- バトル -->
  <section id="screen-battle" class="screen">
    <header class="battle-hud">
      <button id="btn-pause" class="hud-btn" aria-label="一時停止">Ⅱ</button>
      <div class="hud-stage" id="hud-stage"></div>
      <div class="hud-stat"><span class="hs-ico life">♥</span><span id="hud-lives"></span></div>
      <div class="hud-stat"><span class="hs-ico">⚔</span><span id="hud-enemies"></span></div>
      <button id="btn-speed" class="hud-btn wide">▶ x1</button>
    </header>
    <div id="battle-field">
      <canvas id="battle-canvas"></canvas>
      <div id="unit-menu"></div>
      <div id="cutin" class="cutin"></div>
      <div id="battle-banner"></div>
      <div id="battle-toast"></div>
    </div>
    <footer class="deploy">
      <div class="mana"><span class="mana-label">MANA</span><span id="mana-text" class="mana-val">0</span><div class="mana-bar"><i id="mana-fill"></i></div></div>
      <div id="deploy-cards"></div>
    </footer>
  </section>

  <div id="adv" class="adv"></div>
  <div id="modal"><div class="modal-body"></div></div>
  <div id="app-toast"></div>
</div>

<script src="js/data.js"></script>
<script src="js/save.js"></script>
<script src="js/gacha.js"></script>
<script src="js/battle.js"></script>
<script src="js/live.js"></script>
<script src="js/story.js"></script>
<script src="js/app.js"></script>
</body>
</html>
